<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Whitewater Rafting Adventures| WD130</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description"
        content="Contact Whitewater Rafting Adventures. Find our location, phone, email, team members, and send us a message through our contact form.">
    <meta name="author" content="Jan Kristofer Campol">
</head>

<body>
    <header class="header">
        <div class="logo">
            <img src="images/z-wwr-blue.jpg" alt="Whitewater Rafting Company Logo" width="80">
        </div>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html" aria-current="page">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>Contact Us</h1>
            <p>123 Rapids Road, River City, CO 80521</p>
            <p>Phone: (555) 123-4567</p>
            <p>Email: info@raftingadventures.com</p>
        </section>

        <section class="contact-section">
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=..." allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <div class="contact-form border">
                <h2>Send Us a Message</h2>

                <form action="process_form.php" method="post">
                    <div class="form-fields">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>

                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>

                        <fieldset>
                            <legend>Purpose of Message:</legend>
                            <label for="purpose-general">
                                <input type="radio" id="purpose-general" name="purpose" value="general" required>
                                General Inquiry
                            </label>
                            <label for="purpose-reservation">
                                <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                                Reservation Question
                            </label>
                            <label for="purpose-website">
                                <input type="radio" id="purpose-website" name="purpose" value="website">
                                Website Suggestion
                            </label>
                        </fieldset>

                        <label for="message">Message:</label>
                        <textarea id="message" name="message" required></textarea>

                        <div class="checkbox-group">
                            <input type="checkbox" id="subscribe" name="subscribe">
                            <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                        </div>
                    </div>
                    <button type="submit">Send Message</button>
                </form>
            </div>
        </section>

        <section>
            <h2>Meet Our Team</h2>
            <div class="team border">
                <figure>
                    <img src="images/jane_doe.webp" alt="Jane Doe - Lead Guide" width="120">
                    <figcaption>Jane Doe<br>Lead Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/john_doe.jpg" alt="John Doe - Safety Expert" width="120">
                    <figcaption>John Doe<br>Safety Expert</figcaption>
                </figure>
                <figure>
                    <img src="images/jack_doe.jpg" alt="Jack Doe" width="120">
                    <figcaption>Jack Doe<br>Assistant Guide</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <div>
            <p>&copy; 2026 White Water Rafting | Jan Kristofer A. Campol</p>
        </div>
        <nav class="socialmedia" aria-label="Social Media Links">
            <a href="https://facebook.com" aria-label="Visit our Facebook page"><img src="images/facebook.svg" alt="Facebook"></a>
            <a href="https://youtube.com" aria-label="Visit our YouTube channel"><img src="images/youtube.svg" alt="YouTube"></a>
            <a href="https://instagram.com" aria-label="Visit our Instagram profile"><img src="images/instagram.svg" alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
